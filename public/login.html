<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0D0D0D">
  <title>Inloggen – Korton Beheer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #FF6B00;
      --dark:   #0D0D0D;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #181818;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
    }

    .logo { height: 36px; }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      color: white;
      text-align: center;
    }

    .card-sub {
      font-size: 0.83rem;
      color: rgba(255,255,255,0.35);
      margin-top: 0.3rem;
      text-align: center;
    }

    .form { width: 100%; display: flex; flex-direction: column; gap: 0.9rem; }

    .field label {
      display: block;
      font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 0.4rem;
    }

    .field input {
      width: 100%; height: 50px;
      padding: 0 1rem;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      color: white;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      -webkit-appearance: none;
    }

    .field input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255,107,0,0.15);
    }

    .btn-login {
      width: 100%; height: 52px;
      background: var(--orange);
      color: white; border: none;
      border-radius: 12px;
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: 1rem;
      cursor: pointer;
      margin-top: 0.3rem;
      transition: background 0.15s, transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }

    .btn-login:hover  { background: #e05a00; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { background: #444; cursor: not-allowed; transform: none; }

    .btn-spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .btn-login.loading .btn-label  { display: none; }
    .btn-login.loading .btn-spinner { display: block; }

    .error {
      font-size: 0.82rem;
      color: #f87171;
      text-align: center;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
<div class="card">
  <img src="/korton-logo-wit.png" alt="Korton" class="logo">

  <div>
    <div class="card-title">Beheer inloggen</div>
    <div class="card-sub">Alleen voor Korton medewerkers</div>
  </div>

  <form class="form" id="form" novalidate>
    <div class="field">
      <label for="pw">Wachtwoord</label>
      <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="error" id="error"></div>
    <button type="submit" class="btn-login" id="btn">
      <span class="btn-label">Inloggen</span>
      <div class="btn-spinner"></div>
    </button>
  </form>
</div>

<script>
  const form = document.getElementById('form');
  const btn  = document.getElementById('btn');
  const err  = document.getElementById('error');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    btn.classList.add('loading');

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value }),
      });
      if (res.ok) {
        window.location.href = '/beheer';
      } else {
        const d = await res.json();
        err.textContent = d.error || 'Inloggen mislukt.';
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    } catch {
      err.textContent = 'Verbindingsfout.';
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  });
</script>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</body>
</html>
